name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install repository packages
        run: python -m pip install -e ".[tui,scripts]"

      - name: Check repository contracts
        run: python scripts/check_repository.py

      - name: Compile Python sources
        run: python -m compileall -q assurance scripts

      - name: Check PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          foreach ($script in Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "PowerShell syntax errors: $($parseErrors.Count)"
          }

      - name: Run Grok integration fixture tests
        run: python -m unittest discover -s integration/grok/tests -v

      - name: Run runtime control-plane fixture tests
        run: python -m unittest discover -s runtime/tests -v

      - name: Run General Assurance Kernel P0-P5 tests
        run: python -m unittest discover -s assurance/tests -v

  rust-tests:
    name: Rust tests (orz workspace / windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust toolchain (pinned by orz/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Install protoc 35.1 (pinned; mirrors dev-machine orz/bin/protoc)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc-35.1-win64.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'protoc'
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-win64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Add-Content $env:GITHUB_PATH (Join-Path $dest 'bin')

      - name: Install jsonschema (orz-assurance crosscheck tests shell out to python)
        run: python -m pip install jsonschema

      - name: Run orz-loop lib tests
        working-directory: orz
        run: cargo test --locked -p orz-loop --lib

      - name: Run orz-assurance lib tests
        working-directory: orz
        run: cargo test --locked -p orz-assurance --lib

      - name: Run orz-host lib tests (serial — load-sensitive process/timing tests)
        working-directory: orz
        run: cargo test --locked -p orz-host --lib -- --test-threads=1
