name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: prototype/pyproject.toml

      - name: Install contract probe
        run: python -m pip install -e ./prototype

      - name: Check repository contracts
        run: python scripts/check_repository.py

      - name: Compile Python sources
        run: python -m compileall -q prototype/fep_agent_proto scripts

      - name: Check PowerShell script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = @()
          foreach ($script in Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw "PowerShell syntax errors: $($parseErrors.Count)"
          }

      - name: Run unit tests
        run: python -m unittest discover -s prototype/tests -v
