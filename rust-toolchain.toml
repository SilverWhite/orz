[toolchain]
# orz toolchain — pinned to 1.97.1, x86_64-pc-windows-gnu (Phase 1).
# Linux targets: x86_64 + aarch64.
#
# Long-term: migrate to MSVC + Windows SDK on B:.
# Bump policy: one minor version at a time, ≥2 weeks after upstream release.
# Before bumping: cargo check --workspace && cargo clippy --workspace
channel = "1.97.1-x86_64-pc-windows-gnu"
components = ["rustfmt", "clippy"]
profile = "default"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
