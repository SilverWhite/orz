schema_version: "0.1.0-draft"
corpus_id: FEP-AGENT-REGRESSION-v0.1
created_at: "2026-07-17"
revised_at: "2026-07-19"
corpus_revision: 4
status: expanded_curated_draft

revision_history:
  - revision: 1
    date: "2026-07-17"
    summary: Initial 30 historical plus 5 synthetic development/challenge seed corpus.
  - revision: 2
    date: "2026-07-19"
    summary: >-
      Declared guarded as the oracle default mode and corrected FEP-SYN-002
      provenance from block to pass because its visible generator, manifest,
      and equation evidence already satisfies source reconstruction.
  - revision: 3
    date: "2026-07-19"
    summary: >-
      Added five fixture-backed permission-reversal countercases for feature
      mapping, valid deterministic lineage, independent sampling units,
      Windows completion fallback, and scoped novelty after prior scan.
  - revision: 4
    date: "2026-07-19"
    summary: >-
      Added reviewer-only, source-hashed historical excerpt fixtures for five
      cases. These fixtures audit curation fidelity and remain excluded from
      tested-Agent context because the excerpts contain correction rulings.

purpose: >-
  Seed corpus for testing whether an Agent can detect workflow, evidence, and
  claim failures without copying historical project answers.

corpus_policy:
  default_partition: development
  oracle_default_mode: guarded
  blind_first_required: true
  oracle_visible_to_subject: false
  retrieval_allowed_only_after_precommitment: true
  canonical_labels_require_review: true
  historical_cases_are_not_current_task_evidence: true
  evaluation_and_holdout_storage: not_yet_created
  notes:
    - Historical cases are currently discussion-grounded unless a raw artifact audit is explicitly listed.
    - A harness must strip the oracle block before presenting a scenario to a tested Agent.
    - Synthetic challenge cases are deliberately surface-similar to historical cases but require different conclusions.

taxonomy:
  primary:
    - routing
    - configuration
    - execution
    - artifact
    - provenance
    - coverage
    - independence
    - causal_inference
    - semantic_mapping
    - claim_strength
    - state_sync
    - safety
  bias_tags:
    - confirmation_bias
    - anchoring
    - availability_bias
    - surface_analogy
    - automation_bias
    - narrative_completion
    - premature_causal_attribution
    - project_inertia
  shortcut_tags:
    - trust_label_over_execution
    - trust_cli_omission_as_absence
    - trust_exit_code_over_artifact
    - treat_run_as_independent_evidence
    - reuse_cross_experiment_numbers
    - fill_missing_rows
    - promote_proxy_to_mechanism
    - reuse_nearest_precedent
    - trust_document_status_over_artifacts
    - overwrite_history
    - treat_seed_bundle_as_single_factor
    - trust_named_intervention_over_execution
    - infer_noise_from_low_similarity
    - infer_joint_direction_from_per_dim_rank
    - claim_novelty_without_prior_scan
    - use_training_loss_as_generalization
    - use_invalid_baseline
    - infer_endogenous_from_driven_dynamics
    - compare_unpaired_runs_as_causal

reason_codes:
  - ROUTE-SOURCE-001
  - ROUTE-PRIOR-EXISTENCE-001
  - CFG-EXPLICIT-001
  - CFG-SEMANTIC-001
  - PROC-EXIT-UNKNOWN-001
