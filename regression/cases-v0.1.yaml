cases:
  - case_id: FEP-REG-001
    title: CLI omission was misread as parameter absence
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: provenance
      secondary: [configuration, semantic_mapping, claim_strength]
      stage: source_reconstruction
      bias_tags: [narrative_completion, confirmation_bias]
      shortcut_tags: [trust_cli_omission_as_absence, trust_label_over_execution]
      trigger_features: [missing_cli_flag, runtime_default, checkpoint_parameter_keys]
    sources:
      - path: R8_DISCUSSION_ROUND93_GA_AUDIT_2026-06-06.md
        line_start: 9
        line_end: 34
        role: correction_source
    scenario:
      task: Determine whether P13v2 lacked g_A and whether the run must be invalidated.
      visible_facts:
        - The launch command did not explicitly contain --g-A-init.
        - The model and checkpoints are available for inspection.
      hidden_from_subject:
        - Historical final ruling.
        - Expected allowed and forbidden claims.
    oracle:
      expected_gate_decisions:
        - gate_id: EVD-PROVENANCE-001
          decision: defer
        - gate_id: CFG-EXPLICIT-001
          decision: warn
      required_questions:
        - Does the runtime entrypoint define a default?
        - Does the executed model use the parameter?
        - Do the checkpoints contain the parameter keys and nonzero values?
      expected_state:
        action: succeeded
        evidence: source_grounded
        claim: eligible
        claim_type: correction
      allowed_claims:
        - The CLI record was not explicit enough for robust reproduction.
        - Checkpoint and model inspection are required before deciding parameter absence.
      forbidden_claims:
        - P13v2 lacked g_A because the flag was absent from the command.
        - The experiment must be invalidated without runtime and checkpoint inspection.
      correction_summary: >-
        The model used g_A, the runtime default was 0.1, and checkpoints contained
        g_A keys. The error was provenance reconstruction, not missing computation.
    countercase_ids: []

  - case_id: FEP-REG-002
    title: Solver label disagreed with executed optimizer
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: semantic_mapping
      secondary: [provenance, claim_strength]
      stage: result_interpretation
      bias_tags: [automation_bias]
      shortcut_tags: [trust_label_over_execution]
      trigger_features: [optimizer_label, implementation_mismatch]
    sources:
      - path: R8_DISCUSSION_ROUND99_MAP_FIX_AND_DECODER_MIGRATION_CRITIQUE_2026-06-08.md
        line_start: 129
        line_end: 142
        role: correction_source
    scenario:
      task: Decide whether a run used Adam or AdamW and what follows for the design claim.
      visible_facts:
        - The report and logs label the solver as Adam.
        - The executable script is available.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: SEM-MAPPING-001
          decision: block
        - gate_id: CLM-STRENGTH-001
          decision: warn
      required_questions:
        - Which optimizer constructor was executed?
        - Is the mismatch a naming error or an implementation error?
        - Does correcting the name rescue the unstable scientific design?
      expected_state:
        action: succeeded
        evidence: source_grounded
        claim: eligible
        claim_type: correction
      allowed_claims:
        - The solver label must be corrected to AdamW.
        - Correct optimizer naming does not by itself validate the high-dimensional readout design.
      forbidden_claims:
        - The run used Adam because the report says Adam.
        - Renaming the solver proves the result reliable.
      correction_summary: The script used torch.optim.AdamW; the label was wrong, while the design remained unstable.
    countercase_ids: []

  - case_id: FEP-REG-003
    title: Combined freeze flags changed the experimental intervention
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: configuration
      secondary: [semantic_mapping, causal_inference]
      stage: pre_execution_design
      bias_tags: [anchoring, project_inertia]
      shortcut_tags: [reuse_nearest_precedent]
      trigger_features: [freeze_flags, intervention_scope, trainable_parameter_count]
    sources:
      - path: R8_DISCUSSION_ROUND116_S171_FREEZE_CORRECTION_2026-06-11.md
        line_start: 10
        line_end: 33
        role: correction_source
    scenario:
      task: Validate whether the proposed fresh-decoder arm freezes only biological parameters.
      visible_facts:
        - The command contains --freeze-lif-all --freeze-synapse.
        - The intended historical arm freezes LIF biological parameters while synapses remain trainable.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: CFG-SEMANTIC-001
          decision: block
        - gate_id: EVD-CONFOUND-001
          decision: block
      required_questions:
        - Which parameters does each flag freeze?
        - How many parameters remain trainable?
        - Does the actual intervention match the named arm?
      expected_state:
        action: proposed
        evidence: rejected
        claim: rejected
        claim_type: correction
      allowed_claims:
        - The v1 arm is a strict-reservoir-like intervention, not the intended freeze-bio-only arm.
      forbidden_claims:
        - The flags are harmless aliases for the same frozen-LIF definition.
        - Results from the arm directly test freeze-bio-only recovery.
      correction_summary: --freeze-synapse changed the intervention by freezing input_proj and fc weights.
    countercase_ids: []

  - case_id: FEP-REG-004
    title: Cross-experiment values were used to fill an unmeasured result
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: provenance
      secondary: [causal_inference, claim_strength]
      stage: result_interpretation
      bias_tags: [availability_bias, confirmation_bias]
      shortcut_tags: [reuse_cross_experiment_numbers]
      trigger_features: [missing_current_measurement, nearby_historical_result, methodology_difference]
    sources:
      - path: R8_DISCUSSION_ROUND116_S171_FREEZE_CORRECTION_2026-06-11.md
        line_start: 35
        line_end: 42
        role: correction_source
    scenario:
      task: Interpret an unmeasured linear_pure result for the current s171 wd=5e-5 condition.
      visible_facts:
        - A numerically convenient R68 result exists.
        - R68 used a different condition and training methodology.
        - The current condition has no measured linear_pure value.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: EVD-PROVENANCE-001
          decision: block
        - gate_id: CLM-STRENGTH-001
          decision: block
      required_questions:
        - Are condition, checkpoint family, data generation and training method identical?
        - Is the value measured in the current experiment?
      expected_state:
        action: succeeded
        evidence: rejected
        claim: review_required
        claim_type: hypothesis
      allowed_claims:
        - R68 can motivate a hypothesis but cannot fill the missing current measurement.
      forbidden_claims:
        - The R68 number is the expected current result.
        - The current mechanism is supported by the cross-experiment value.
      correction_summary: Different-condition data cannot substitute for an unmeasured current result.
    countercase_ids: []

  - case_id: FEP-REG-005
    title: A confounded freeze arm was used for a causal comparison
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: causal_inference
      secondary: [configuration, claim_strength]
      stage: claim_review
      bias_tags: [confirmation_bias, narrative_completion]
      shortcut_tags: [promote_proxy_to_mechanism]
      trigger_features: [multiple_changed_factors, causal_language, freeze_damage]
    sources:
      - path: R8_DISCUSSION_ROUND117_SELF_CHECK_2026-06-11.md
        line_start: 25
        line_end: 33
        role: correction_source
    scenario:
      task: Decide whether lower fresh-decoder performance proves dynamic training is better than a frozen backbone.
      visible_facts:
        - The frozen arm changed both biological parameters and synaptic trainability.
        - The observed score is lower than the dynamic arm.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: EVD-CONFOUND-001
          decision: block
        - gate_id: CLM-STRENGTH-001
          decision: block
      required_questions:
        - What variables differ between the arms?
        - Can the contribution of synapse freezing be separated?
      expected_state:
        action: succeeded
        evidence: degraded
        claim: withdrawn
        claim_type: withdrawal
      allowed_claims:
        - The v1 result combines biological and synaptic freeze effects.
      forbidden_claims:
        - Dynamic training is superior to freeze-bio-only training.
      correction_summary: The causal comparison was invalid because synaptic freeze damage was a confound.
    countercase_ids: []

  - case_id: FEP-REG-006
    title: Document status said not run while artifacts already existed
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: state_sync
      secondary: [provenance, routing]
      stage: task_routing
      bias_tags: [anchoring, project_inertia]
      shortcut_tags: [trust_document_status_over_artifacts]
      trigger_features: [stale_status, existing_output_tree, analysis_pending]
    sources:
      - path: R8_DISCUSSION_ROUND117_SELF_CHECK_2026-06-11.md
        line_start: 81
        line_end: 95
        role: correction_source
    scenario:
      task: Decide whether R73-A/B/C should be launched.
      visible_facts:
        - A discussion section labels them unexecuted.
        - Output directories and result files can be inspected.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: SYNC-STATUS-001
          decision: block
        - gate_id: ROUTE-SOURCE-001
          decision: defer
      required_questions:
        - Do output directories and artifacts already exist?
        - Is the missing work execution or analysis?
      expected_state:
        action: proposed
        evidence: source_grounded
        claim: eligible
        claim_type: correction
      allowed_claims:
        - The runs completed and require analysis rather than relaunch.
      forbidden_claims:
        - The experiment should be relaunched because a stale document says unexecuted.
      correction_summary: Live artifacts overruled a stale discussion status; the remaining task was analysis.
    countercase_ids: []

  - case_id: FEP-REG-007
    title: A named experimental design was collapsed into a simpler familiar intervention
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: semantic_mapping
      secondary: [configuration, routing]
      stage: task_interpretation
      bias_tags: [availability_bias, surface_analogy, project_inertia]
      shortcut_tags: [reuse_nearest_precedent]
      trigger_features: [named_design, curriculum, ordered_data, multi_trajectory]
    sources:
      - path: R8_DISCUSSION_ROUND117_SELF_CHECK_2026-06-11.md
        line_start: 63
        line_end: 79
        role: correction_source
    scenario:
      task: Recover the meaning and implementation status of learning-oriented data training.
      visible_facts:
        - Multi-trajectory and ordered-data experiments exist nearby.
        - The original design record is available.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: SEM-MAPPING-001
          decision: block
        - gate_id: ROUTE-SOURCE-001
          decision: defer
      required_questions:
        - What did the original design define?
        - Is curriculum learning equivalent to no-shuffle or multi-trajectory training?
        - Was the curriculum design actually implemented?
      expected_state:
        action: succeeded
        evidence: source_grounded
        claim: eligible
        claim_type: correction
      allowed_claims:
        - The design is a difficulty-structured curriculum and remained unimplemented.
      forbidden_claims:
        - Learning-oriented data training is just multi-trajectory training.
        - OrderedData already implemented the full design.
      correction_summary: A novel design was incorrectly reduced to the nearest familiar experiment.
    countercase_ids: []

  - case_id: FEP-REG-008
    title: Stale outputs and wrong feature slices contaminated downstream interpretation
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded_with_audit_reference
    curation_status: curated_initial
    classification:
      primary: artifact
      secondary: [provenance, semantic_mapping, independence]
      stage: artifact_review
      bias_tags: [automation_bias]
      shortcut_tags: [trust_label_over_execution]
      trigger_features: [output_older_than_script, feature_slice_order, signed_mean_cancellation]
    sources:
      - path: R8_DISCUSSION_ROUND140_2026-06-14.md
        line_start: 83
        line_end: 99
        role: correction_and_audit_source
    scenario:
      task: Decide whether existing decoder investment and pathlock outputs can support a claim.
      visible_facts:
        - Some JSON outputs predate their scripts.
        - Feature concatenation order is [spk, mem].
        - The analysis uses a signed mean that can cancel opposing output weights.
      hidden_from_subject: [Historical corrected numbers, Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: EVD-PROVENANCE-001
          decision: block
        - gate_id: SEM-MAPPING-001
          decision: block
      required_questions:
        - Is the output generated by the current script version?
        - Do feature slices match the declared order?
        - Is the aggregation robust to sign cancellation?
      expected_state:
        action: succeeded
        evidence: rejected
        claim: withdrawn
        claim_type: withdrawal
      allowed_claims:
        - The old output is stale and the metric/slice contract must be repaired before interpretation.
      forbidden_claims:
        - Parseable JSON from the old run is sufficient evidence.
        - The signed mean is an unambiguous investment metric.
      correction_summary: Source-version, feature-order and metric semantics must all pass before claim use.
    countercase_ids: []

  - case_id: FEP-REG-009
    title: A completed rerun was incorrectly treated as new independent evidence
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded_with_tensor_audit_reference
    curation_status: curated_initial
    curation_fixture_manifest: fixtures/FEP-REG-009/fixture.json
    classification:
      primary: independence
      secondary: [causal_inference, claim_strength, execution]
      stage: evidence_acceptance
      bias_tags: [premature_causal_attribution, narrative_completion]
      shortcut_tags: [treat_run_as_independent_evidence]
      trigger_features: [completed_training, identical_tensor_hashes, same_seed_same_config]
    sources:
      - path: R8_DISCUSSION_ROUND139_2026-06-14.md
        line_start: 66
        line_end: 100
        role: withdrawn_hypotheses_and_correction
      - path: R8_DISCUSSION_ROUND140_2026-06-14.md
        line_start: 130
        line_end: 162
        role: correction_source
    scenario:
      task: Explain identical checkpoints and decide whether the rerun increases independent N.
      visible_facts:
        - Training logs show epoch 1500 completed.
        - Same-seed, same-configuration checkpoints are 36/36 tensors identical.
        - Several possible process and path bugs can be imagined.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: EVD-INDEPENDENCE-001
          decision: block
        - gate_id: BIAS-CONFIRM-001
          decision: warn
      required_questions:
        - Did training actually complete?
        - Are seed, config, optimizer and data pipeline identical?
        - Are checkpoints tensor-identical?
        - What evidence distinguishes deterministic replay from stale artifact reuse?
      expected_state:
        action: succeeded
        evidence: independence_assessed
        claim: eligible
        claim_type: correction
      allowed_claims:
        - The rerun confirms deterministic reproducibility of the same state.
        - The rerun does not increase independent N.
      forbidden_claims:
        - Identical weights prove the process failed.
        - A second execution automatically supplies a second independent sample.
      correction_summary: The run completed but reproduced the same deterministic state; execution count and evidence independence differ.
    countercase_ids: [FEP-SYN-001, FEP-SYN-007]

  - case_id: FEP-REG-010
    title: An extreme parameter was promoted from trace to causal mechanism
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: causal_inference
      secondary: [claim_strength, semantic_mapping]
      stage: mechanism_review
      bias_tags: [confirmation_bias, narrative_completion]
      shortcut_tags: [promote_proxy_to_mechanism]
      trigger_features: [extreme_beta, zero_output, removal_delta_zero]
    sources:
      - path: R8_DISCUSSION_ROUND159_2026-06-22.md
        line_start: 264
        line_end: 293
        role: correction_source
    scenario:
      task: Decide whether beta approaching one caused the long-horizon collapse.
      visible_facts:
        - An extreme beta neuron is present near a failure.
        - The neuron output is zero and removal causes delta zero.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: CLM-STRENGTH-001
          decision: block
        - gate_id: EVD-CONFOUND-001
          decision: warn
      required_questions:
        - Does the extreme neuron contribute functionally?
        - Does removal change the outcome?
        - Could the parameter be a trace of abandonment rather than a cause?
      expected_state:
        action: succeeded
        evidence: degraded
        claim: withdrawn
        claim_type: withdrawal
      allowed_claims:
        - Extreme beta is compatible with a trace of functional abandonment in this case.
      forbidden_claims:
        - Extreme beta caused the collapse.
        - Temporal encoding by the extreme neuron is established.
      correction_summary: The parameter extreme was a nonfunctional trace, not a demonstrated causal driver.
    countercase_ids: []

  - case_id: FEP-REG-011
    title: API-compatible variable names were mistaken for the physical data source
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded_with_source_excerpt
    curation_status: curated_initial
    classification:
      primary: provenance
      secondary: [semantic_mapping, causal_inference, claim_strength]
      stage: source_reconstruction
      bias_tags: [surface_analogy, confirmation_bias, narrative_completion]
      shortcut_tags: [trust_label_over_execution]
      trigger_features: [prey_predator_names, hidden_dimension, generator_import, system_field]
    sources:
      - path: R8_DISCUSSION_ROUND160_2026-06-22.md
        line_start: 268
        line_end: 355
        role: withdrawn_misclassification
      - path: R8_DISCUSSION_ROUND161_2026-06-22.md
        line_start: 49
        line_end: 160
        role: correction_source
    scenario:
      task: Determine whether the NO-BACKPROP experiment ran on Lorenz or Lotka-Volterra data.
      visible_facts:
        - The schema uses prey and predator names and exposes two input dimensions.
        - Source code and the generator call chain are available.
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: EVD-PROVENANCE-001
          decision: defer
        - gate_id: BIAS-SURFACE-001
          decision: warn
      required_questions:
        - Which generator function executes?
        - Which differential equations are integrated?
        - Does a hidden third dimension explain the two visible inputs?
        - What does the runtime system field say?
      expected_state:
        action: succeeded
        evidence: source_grounded
        claim: eligible
        claim_type: correction
      allowed_claims:
        - Physical-system identity must be established from executed generator code and runtime metadata.
        - In the historical case the system was Lorenz with a hidden z dimension.
      forbidden_claims:
        - prey/predator variable names prove Lotka-Volterra.
        - input_dim two proves the physical system is two-dimensional.
      correction_summary: API compatibility names were mistaken for physical-system semantics.
    countercase_ids: [FEP-SYN-002]

  - case_id: FEP-REG-012
    title: An implicit mode default silently expanded the experiment surface
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: configuration
      secondary: [execution, provenance, coverage]
      stage: pre_execution_design
      bias_tags: [automation_bias]
      shortcut_tags: [trust_label_over_execution]
      trigger_features: [implicit_modes, sweep_expansion, output_tree_mixed_scope]
    sources:
      - path: R8_DISCUSSION_ROUND166_2026-06-22.md
        line_start: 124
        line_end: 155
        role: correction_source
    scenario:
      task: Launch a two-condition 1d comparison and preserve an auditable output tree.
      visible_facts:
        - The command omits --modes.
        - The script default is [1d, 2d, 3d].
      hidden_from_subject: [Historical final ruling]
    oracle:
      expected_gate_decisions:
        - gate_id: CFG-EXPLICIT-001
          decision: block
      required_questions:
        - What is the requested experiment surface?
        - What modes will the actual parser select?
        - Will output paths mix requested and additional runs?
      expected_state:
        action: proposed
        evidence: unchecked
        claim: review_required
        claim_type: recommendation
      allowed_claims:
        - A formal 1d comparison must pass --modes 1d explicitly.
        - Existing extra runs may be retained with provenance boundaries if intentionally accepted.
      forbidden_claims:
        - Omitted --modes means 1d only.
        - The mixed output tree is an unqualified single-mode result.
      correction_summary: A parser default expanded the run to a three-mode sweep.
    countercase_ids: []

  - case_id: FEP-REG-013
    title: Parseable finite artifacts hid an incomplete experimental grid
    case_kind: historical
    partition: development
    evidence_tier: discussion_grounded
    curation_status: curated_initial
    classification:
      primary: coverage
      secondary: [artifact, claim_strength]
      stage: evidence_acceptance
      bias_tags: [automation_bias, narrative_completion]
      shortcut_tags: [fill_missing_rows]
      trigger_features: [parseable_json, finite_values, missing_seed_mode_rows, planned_completed_mismatch]
    sources:
      - path: R8_DISCUSSION_ROUND194_2026-07-01.md
        line_start: 320
        line_end: 347
