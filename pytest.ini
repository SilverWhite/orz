[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
; RS-16（2026-09-19）：归档/原型目录不参与收集——顶层裸跑 `pytest` 时
; 存档卷内遗留件（如 tests_after_fix.txt）会被误收集并报 UnicodeDecodeError。
norecursedirs = 存档 prototype prototype.* .build .tools candidate-gates observed-runs .observed-runs evaluation regression
