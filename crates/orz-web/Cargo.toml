[package]
name = "orz-web"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Web workbench bridge — local loopback server serving the static three-draft UI and pumping ACP over WebSocket to `orz --stdio` (0br S2)"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
# REV-083-21 (2026-09-27): canonicalization without Windows `\\?\` verbatim
# prefixes (workspace clippy.toml bans `std::fs::canonicalize`).
dunce = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
orz-workspace = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
