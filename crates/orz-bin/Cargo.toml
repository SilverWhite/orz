[package]
name = "orz-bin"
version = "0.8.10"
edition = "2024"
license = "Apache-2.0"
description = "orz — assurance-first CLI agent workbench (Phase 1 scaffold)"

[[bin]]
name = "orz"
path = "src/main.rs"

[dependencies]
orz-assurance = { path = "../orz-assurance" }
orz-loop = { path = "../orz-loop" }
orz-host = { path = "../orz-host" }
orz-tui = { path = "../orz-tui" }
orz-web = { path = "../orz-web" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }



[dev-dependencies]
# Capture tests answer allow-once permission requests over the in-process
# ACP wire (conformance_capture, Phase 3 #7).
agent-client-protocol = { workspace = true }
# P1-1 stall-guard tests implement a silent ModelGateway (async_trait) and
# name the cancellation token in its signature.
async-trait = { workspace = true }
tokio-util = { workspace = true }
