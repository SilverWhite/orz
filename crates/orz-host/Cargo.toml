[package]
name = "orz-host"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "orz thin core — ACP server + LoopHost implementation + session lifecycle"

[dependencies]
# ACP protocol
agent-client-protocol = { workspace = true }
xai-acp-lib = { workspace = true }

# Self-built core
orz-loop = { path = "../orz-loop" }
orz-assurance = { path = "../orz-assurance" }

# Grok providers (public APIs only)
# NOTE: orz-chat-state / orz-hooks / orz-auth / orz-secrets / orz-sandbox are
# listed in the fusion design §3.2 but intentionally not yet declared — they
# are wired in Phase 3 (2026-08-04 review P2-7).
orz-tools = { path = "../codegen/orz-tools" }
orz-workspace = { path = "../codegen/orz-workspace" }
orz-paths = { path = "../codegen/orz-paths" }
xai-tool-runtime = { path = "../common/xai-tool-runtime" }

# Runtime
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
