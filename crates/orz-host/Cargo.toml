[package]
name = "orz-host"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "orz thin core — ACP server + LoopHost implementation + session lifecycle"

[dependencies]
# ACP protocol
agent-client-protocol = { workspace = true }
xai-acp-lib = { workspace = true }

# Self-built core
orz-loop = { path = "../orz-loop" }
orz-assurance = { path = "../orz-assurance" }

# Grok providers (public APIs only)
# NOTE: orz-chat-state / orz-hooks / orz-auth / orz-sandbox are listed in the
# fusion design §3.2 but intentionally not yet declared — they are wired in
# Phase 3 (2026-08-04 review P2-7). orz-secrets joined 2026-09-07 (0p S2 B5:
# `.gsa` session-sidecar persistent-write scrubbing).
orz-tools = { path = "../codegen/orz-tools" }
orz-secrets = { workspace = true }
orz-workspace = { path = "../codegen/orz-workspace" }
orz-paths = { path = "../codegen/orz-paths" }
orz-config = { path = "../codegen/orz-config" }
xai-tool-runtime = { path = "../common/xai-tool-runtime" }

# Runtime
tokio = { workspace = true, features = ["full"] }
# Path canonicalization without Windows `\\?\` verbatim prefixes (clippy.toml ban).
dunce = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }

# Keystore (permit signing — install-level key, Windows DPAPI)
ring = { workspace = true }

# local_browser (2026-08-10): CDP-over-WebSocket client for the headless
# browser retrieval lane (ADR-0010 §3.7). All three are workspace deps already
# in the lock graph — zero new transitive entries.
tokio-tungstenite = { workspace = true }
url = { workspace = true }
futures = { workspace = true }

# project_doc_index v2 (RETRIEVAL-ORCHESTRATION-MECHANICAL 0k 第二批,
# 2026-08-30)：条目内容身份哈希——workspace 既有依赖（orz-config /
# orz-memory 在用），零新增传递依赖。
blake3 = { workspace = true }
# P2-13 B3（2026-09-03，ADR-0010 §14.52 / 设计 §11.3）：会话存档单 gzip
# 包（`.gsa/archives/<session8>.json.gz`，纯打包零内容变换）。
flate2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
# A5 retention tests: backdate record mtimes deterministically (workspace
# dep — already in the lock graph, zero new transitive entries).
filetime = { workspace = true }
