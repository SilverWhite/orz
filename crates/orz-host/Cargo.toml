[package]
name = "orz-host"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "orz thin core — ACP server + LoopHost implementation + session lifecycle"

[dependencies]
# ACP protocol
agent-client-protocol = { workspace = true }
xai-acp-lib = { workspace = true }

# Self-built core
orz-loop = { path = "../orz-loop" }
orz-assurance = { path = "../orz-assurance" }

# Grok providers (public APIs only)
orz-tools-api = { path = "../codegen/orz-tools-api" }
orz-workspace = { path = "../codegen/orz-workspace" }
orz-mcp = { path = "../codegen/orz-mcp" }
orz-config = { path = "../codegen/orz-config" }
orz-models = { path = "../codegen/orz-models" }

# Runtime
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
