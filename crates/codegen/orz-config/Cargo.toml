[package]
license = "Apache-2.0"
name = "orz-config"
version = "0.1.0"
edition.workspace = true
description = "Shared config loading for Grok — grok_home, effective config (requirements > user > managed), TOML merge"

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
dunce = { workspace = true }
# Shared signed deployment-config envelope contract with the cli-chat-proxy signer.
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
ring = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3.1"
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
which = { workspace = true }
xai-tty-utils = { workspace = true }
orz-version = { workspace = true }

# core-foundation: read macOS MDM managed preferences (`ai.x.grok`) for the
# admin-deployed requirements layer.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

# File identity for managed_text revalidation: GetFileInformationByHandle
# (volume serial + file index) is the Windows analogue of unix (dev, ino).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # CreateFileW's signature references SECURITY_ATTRIBUTES, so windows-sys
    # gates it (and CreateFileW itself) under Win32_Security.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # Git for Windows install-root discovery (find_git_bash registry probe).
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = { workspace = true }

[features]

[lints]
workspace = true