[package]
license = "Apache-2.0"
name = "orz-agent"
version = "0.1.0"
edition.workspace = true
description = "Skills/plugins/agents-md discovery surfaces and workspace toolset assembly"

[dependencies]
chrono = { workspace = true }
dunce = { workspace = true }
dirs = "6"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ignore = { workspace = true }
orz-assurance = { path = "../../orz-assurance" }
orz-config = { workspace = true }
orz-hooks = { path = "../orz-hooks" }
orz-tools = { path = "../orz-tools" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
xai-tty-utils = { workspace = true }

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
